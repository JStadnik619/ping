# If a repository has had no commits, issues, or PRs in the last 60 days, 
# GitHub automatically disables scheduled workflows silently. This workflow
# pushes a commit to re-enable them.

name: Keep Repo Alive

on:
  schedule:
    # Runs once every 50 days (well under the 60-day limit)
    - cron: '0 0 */50 * *' 
  workflow_dispatch: # Allows manual triggering

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push commits

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch full history for safety

      - name: Create empty commit
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git commit --allow-empty -m "chore: keep repo active to prevent workflow disable"
          git push
        env:
          # GitHub automatically creates a temporary, scoped token for every
          # job and injects it as the secret (no repo secrets setup required)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   