name: Run Ping Script
on:
  schedule:
    # Runs every 10 minutes from 12:00 UTC to 02:59 UTC (covers 6am-9pm CST)
    # 12:00 UTC = 6:00 AM CST
    # 03:00 UTC = 9:00 PM CST (Job runs at 00:00, 00:10, 00:20 ... 02:50)
    - cron: '*/10 12-23,0-2 * * *'
  workflow_dispatch:  # Allows manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Ping Script
        run: node ping.js
        env:
          TARGET_URL:  'https://berea-web.onrender.com/'
